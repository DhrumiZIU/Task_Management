{% extends "base.html" %}
{% block title %}Change Password — Team Planner{% endblock %}
{% block topbar_title %}Change Password{% endblock %}
{% block topbar_sub %}Update your account password{% endblock %}

{% block content %}
<div style="max-width:480px;margin:0 auto">
  <div class="card" style="padding:32px">
    <form method="post">
      <div class="field">
        <label for="current_password">Current Password</label>
        <input id="current_password" type="password" name="current_password"
               placeholder="Enter current password" autocomplete="current-password" required autofocus>
      </div>
      <div class="field">
        <label for="new_password">New Password</label>
        <input id="new_password" type="password" name="new_password"
               placeholder="At least 6 characters" autocomplete="new-password" required>
      </div>
      <div class="field" style="margin-bottom:24px">
        <label for="confirm_password">Confirm New Password</label>
        <input id="confirm_password" type="password" name="confirm_password"
               placeholder="Repeat new password" autocomplete="new-password" required>
      </div>
      <div style="display:flex;gap:12px">
        <button type="submit" class="btn btn-primary">Update Password</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
