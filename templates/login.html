<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Team Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .login-page {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d1526 0%, #1a2540 40%, #0f1d35 100%);
      display: flex; align-items: center; justify-content: center; padding: 24px;
      position: relative; overflow: hidden;
    }
    .login-bg-glow {
      position: absolute;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(37,99,235,.18) 0%, transparent 70%);
      top: -100px; left: -100px; pointer-events: none;
    }
    .login-bg-glow2 {
      position: absolute;
      width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,.12) 0%, transparent 70%);
      bottom: -50px; right: -50px; pointer-events: none;
    }
    .login-box { width: 100%; max-width: 420px; position: relative; z-index: 1; }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-logo {
      width: 58px; height: 58px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px; color: #fff;
      box-shadow: 0 10px 30px rgba(37,99,235,.45);
    }
    .login-header h1 {
      font-size: 24px; font-weight: 800; color: #f1f5f9; letter-spacing: -.4px;
    }
    .login-header p { font-size: 13.5px; color: #64748b; margin-top: 5px; }
    .login-card {
      background: #fff;
      border-radius: 16px; padding: 30px 32px;
      box-shadow: 0 24px 70px rgba(0,0,0,.38), 0 1px 2px rgba(255,255,255,.04) inset;
    }
    .login-card .field label { font-size: 13px; font-weight: 600; color: #334155; }
    .login-card .field input {
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      padding: 10px 13px; font-size: 14px; color: #0f172a;
      transition: border-color .18s, box-shadow .18s;
      background: #f8fafc;
    }
    .login-card .field input:focus {
      border-color: #2563eb; background: #fff;
      box-shadow: 0 0 0 4px rgba(37,99,235,.10);
    }
    .login-card .btn-primary {
      height: 44px; font-size: 14px; font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 4px 16px rgba(37,99,235,.30);
      border: none; border-radius: 9px;
    }
    .login-card .btn-primary:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 6px 20px rgba(37,99,235,.38);
    }
    .login-hint {
      margin-top: 20px; padding: 12px 16px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: 9px; font-size: 11.5px; color: #475569;
      line-height: 1.9; text-align: center;
    }
    @keyframes loginFadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .login-box { animation: loginFadeIn .3s ease both; }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-bg-glow"></div>
  <div class="login-bg-glow2"></div>
  <div class="login-box">
    <div class="login-header">
      <div class="login-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
      </div>
      <h1>Team Daily Planner</h1>
      <p>Sign in to access your workspace</p>
    </div>
    <div class="login-card">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}" style="margin-bottom:16px">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="post">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" name="username"
                 placeholder="Enter your username" autocomplete="username" required autofocus>
        </div>
        <div class="field" style="margin-bottom:20px">
          <label for="password">Password</label>
          <input id="password" type="password" name="password"
                 placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:4px">
            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Sign In
        </button>
      </form>
    </div>
    <div class="login-hint">
      Manager login: use your manager credentials<br>
      Members: use your assigned username &amp; password
    </div>
  </div>
</div>
</body>
</html>
