<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ZIU AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0b1120;
    --surface: #111827;
    --border:  rgba(255,255,255,.08);
    --card-bg: #ffffff;
    --primary: #2563eb;
    --primary-h:#1d4ed8;
    --text:    #0f172a;
    --text2:   #334155;
    --text3:   #64748b;
    --text4:   #94a3b8;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Canvas background ── */
  #bg-canvas {
    position: fixed; inset: 0; z-index: 0;
    display: block;
  }

  /* ── Page wrapper ── */
  .login-scene {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
    overflow-y: auto;
  }

  /* ── Avatar (enters first) ── */
  .login-avatar-wrap {
    position: relative; z-index: 10;
    opacity: 0;
    transform: translateY(-80px) scale(.6);
    animation: avatarDrop .65s cubic-bezier(.34,1.56,.64,1) .3s forwards;
    margin-bottom: -28px; /* overlaps card top */
  }
  @keyframes avatarDrop {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .login-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(145deg, #3b82f6, #1d4ed8);
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 0 0 4px rgba(37,99,235,.2),
      0 0 0 8px rgba(37,99,235,.08),
      0 20px 40px rgba(37,99,235,.4);
    animation: avatarPulse 2.4s ease-in-out 1.2s infinite;
  }
  @keyframes avatarPulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(37,99,235,.2), 0 0 0 8px rgba(37,99,235,.08), 0 20px 40px rgba(37,99,235,.4); }
    50%       { box-shadow: 0 0 0 6px rgba(37,99,235,.28), 0 0 0 14px rgba(37,99,235,.1), 0 20px 48px rgba(37,99,235,.5); }
  }

  /* ── Login card (enters second) ── */
  .login-card-wrap {
    width: 100%; max-width: 400px;
    opacity: 0;
    transform: translateY(28px) scale(.97);
    animation: cardRise .55s cubic-bezier(.4,0,.2,1) .88s forwards;
  }
  @keyframes cardRise {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .login-card {
    background: #fff;
    border-radius: 20px;
    padding: 44px 32px 32px;  /* top padding gives room for avatar overlap */
    box-shadow:
      0 32px 80px rgba(0,0,0,.45),
      0 1px 0 rgba(255,255,255,.12) inset;
    position: relative;
  }

  .login-card-header {
    text-align: center;
    margin-bottom: 28px;
    padding-top: 10px;
  }
  .login-card-title {
    font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -.4px;
    margin-bottom: 5px;
  }
  .login-card-sub {
    font-size: 13px; color: var(--text3); font-weight: 400;
  }

  /* ── Form fields ── */
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label {
    font-size: 12.5px; font-weight: 600; color: var(--text2);
    letter-spacing: .1px;
  }
  .field input {
    width: 100%; padding: 11px 14px;
    border: 1.5px solid #e2e8f0; border-radius: 10px;
    font-size: 14px; color: var(--text);
    background: #f8fafc;
    font-family: inherit;
    transition: border-color .18s, box-shadow .18s, background .18s;
    outline: none;
  }
  .field input:focus {
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(37,99,235,.1);
  }
  .field input::placeholder { color: #b0bac7; }

  /* ── Submit button ── */
  .btn-signin {
    width: 100%; height: 46px; margin-top: 6px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 14px; font-weight: 700; color: #fff;
    background: #1e40af;
    border: none; border-radius: 10px; cursor: pointer;
    font-family: inherit; letter-spacing: .1px;
    transition: background .15s, transform .1s, box-shadow .15s;
    box-shadow: 0 4px 14px rgba(30,64,175,.35);
  }
  .btn-signin:hover  { background: #1d4ed8; box-shadow: 0 6px 20px rgba(29,78,216,.45); }
  .btn-signin:active { transform: scale(.98); }

  /* ── Flash messages ── */
  .flash {
    padding: 10px 14px; border-radius: 9px; font-size: 13px;
    font-weight: 500; margin-bottom: 16px;
  }
  .flash-error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .flash-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }

  /* ── Footer hint ── */
  .login-hint {
    text-align: center; margin-top: 16px;
    font-size: 11.5px; color: rgba(148,163,184,.7);
    line-height: 1.8;
  }

  /* ── App name above card ── */
  .login-brand {
    text-align: center;
    color: rgba(255,255,255,.8);
    font-size: 12.5px; font-weight: 600;
    letter-spacing: .3px;
    margin-bottom: 10px;
    opacity: 0;
    animation: fadeIn .5s ease .4s forwards;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .login-brand-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--primary);
    animation: dotPulse 2s ease-in-out 1s infinite;
    flex-shrink: 0;
  }
  @keyframes dotPulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%     { opacity:.5; transform:scale(1.4); }
  }
  @keyframes fadeIn { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; }
  }

  /* ── Particle lines glow ── */
  .orb {
    position: fixed; border-radius: 50%; pointer-events: none;
    filter: blur(80px); z-index: 0;
  }
  .orb-1 {
    width: 500px; height: 500px; top: -120px; left: -120px;
    background: radial-gradient(circle, rgba(37,99,235,.14) 0%, transparent 70%);
    animation: orbDrift1 12s ease-in-out infinite alternate;
  }
  .orb-2 {
    width: 400px; height: 400px; bottom: -100px; right: -80px;
    background: radial-gradient(circle, rgba(99,102,241,.10) 0%, transparent 70%);
    animation: orbDrift2 15s ease-in-out infinite alternate;
  }
  @keyframes orbDrift1 { to { transform: translate(60px, 80px); } }
  @keyframes orbDrift2 { to { transform: translate(-40px, -60px); } }

  @media (max-width: 480px) {
    .login-card { padding: 44px 20px 24px; border-radius: 16px; }
    .login-card-title { font-size: 18px; }
  }
  </style>
</head>
<body>

<!-- Particle canvas -->
<canvas id="bg-canvas"></canvas>

<!-- Ambient orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="login-scene">

  <!-- App label -->
  <div class="login-brand">
    <div class="login-brand-dot"></div>
    ZIU AI — Team Daily Planner
  </div>

  <!-- Avatar drops first -->
  <div class="login-avatar-wrap">
    <div class="login-avatar">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
  </div>

  <!-- Card rises after avatar -->
  <div class="login-card-wrap">
    <div class="login-card">
      <div class="login-card-header">
        <div class="login-card-title">Welcome back</div>
        <div class="login-card-sub">Sign in to your workspace</div>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" name="username"
                 placeholder="Enter your username"
                 autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" name="password"
                 placeholder="Enter your password"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-signin">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Sign In
        </button>
      </form>
    </div>

  </div>

</div>

<script>
(function () {
  var canvas = document.getElementById('bg-canvas');
  var ctx    = canvas.getContext('2d');
  var W, H, particles;
  var PARTICLE_COUNT = 60;
  var CONNECTION_DIST = 130;
  var PARTICLE_COLOR  = 'rgba(148,163,184,';

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function Particle() {
    this.x  = Math.random() * W;
    this.y  = Math.random() * H;
    this.vx = (Math.random() - .5) * .4;
    this.vy = (Math.random() - .5) * .4;
    this.r  = Math.random() * 1.5 + .6;
    this.a  = Math.random() * .5 + .2;
  }
  Particle.prototype.update = function () {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0 || this.x > W) this.vx *= -1;
    if (this.y < 0 || this.y > H) this.vy *= -1;
  };

  function init() {
    resize();
    particles = [];
    for (var i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // connections
    for (var i = 0; i < particles.length; i++) {
      var p1 = particles[i];
      for (var j = i + 1; j < particles.length; j++) {
        var p2   = particles[j];
        var dx   = p1.x - p2.x;
        var dy   = p1.y - p2.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CONNECTION_DIST) {
          var alpha = (1 - dist / CONNECTION_DIST) * .18;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = PARTICLE_COLOR + alpha + ')';
          ctx.lineWidth   = .8;
          ctx.stroke();
        }
      }
    }
    // dots
    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = PARTICLE_COLOR + p.a + ')';
      ctx.fill();
      p.update();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', function () {
    resize();
  });

  init();
  draw();
})();
</script>
</body>
</html>
